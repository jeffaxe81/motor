name: Bootstrap lockfile

on:
  push:
    branches:
      - feat/m1-asset-registration-20260912

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch
        uses: actions/checkout@v4
        with:
          ref: feat/m1-asset-registration-20260912
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Habilitar Corepack
        run: corepack enable

      - name: Gerar lockfile reproduzível
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Versionar lockfile quando necessário
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]]; then
            echo "pnpm-lock.yaml já está sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: versionar lockfile do pnpm"
          git push origin HEAD:feat/m1-asset-registration-20260912
