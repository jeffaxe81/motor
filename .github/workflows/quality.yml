name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asset_inventory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asset_inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/asset_inventory_test
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: Publicar lockfile inicial
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml

      - name: Verificar TypeScript
        run: pnpm check

      - name: Executar testes
        run: pnpm test

      - name: Gerar build
        run: pnpm build
